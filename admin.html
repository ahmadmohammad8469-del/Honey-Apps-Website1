<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">📱 تطبيقاتي</a></div></header><main class="wrap"><section class="panel"><h1>لوحة التحكم</h1><input id="pw" type="password" placeholder="كلمة مرور المدير"><form id="form" hidden><input name="name" placeholder="اسم التطبيق" required><input name="version" placeholder="الإصدار" value="1.0.0"><input name="category" placeholder="التصنيف" value="أخرى"><input name="icon" placeholder="أيقونة/إيموجي" value="📱"><textarea name="description" placeholder="وصف التطبيق"></textarea><input name="apk" type="file" required><button>رفع التطبيق</button></form><div id="msg"></div><div id="list"></div></section></main>
<script>
let token="";const pw=document.querySelector("#pw"),form=document.querySelector("#form"),msg=document.querySelector("#msg"),list=document.querySelector("#list");
pw.onchange=()=>{token=pw.value;form.hidden=false;load()};form.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/apps",{method:"POST",headers:{Authorization:"Bearer "+token},body:new FormData(form)});msg.textContent=r.ok?"تم رفع التطبيق بنجاح":"حدث خطأ: "+(await r.text());if(r.ok){form.reset();load()}};
async function load(){let r=await fetch("/api/admin/apps",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return;let a=await r.json();list.innerHTML=a.map(x=>`<div class="row"><b>${x.icon} ${x.name}</b><span>${x.downloads} تحميل</span><button onclick="del('${x.id}')">حذف</button></div>`).join("")}
async function del(id){if(confirm("حذف التطبيق؟")){await fetch("/api/admin/apps/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}}
</script></body></html>
